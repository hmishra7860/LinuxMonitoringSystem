services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: linuxwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linuxwatch}
      POSTGRES_DB: linuxwatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linuxwatch -d linuxwatch"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host on purpose; only the API container can reach it.

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://linuxwatch:${POSTGRES_PASSWORD:-linuxwatch}@db:5432/linuxwatch
    ports:
      - "8000:8000"

volumes:
  pgdata:
